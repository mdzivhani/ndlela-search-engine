services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ndlela
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ndlela"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    profiles: [admin]
    image: adminer
    ports:
      - '127.0.0.1:8083:8080'

  business-api:
    build:
      context: ./backend/services
      dockerfile: SA.Tourism.Business.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - BUSINESS_DB_CONN=Host=postgres;Database=ndlela;Username=postgres;Password=postgres
      - ConnectionStrings__BusinessDb=Host=postgres;Database=ndlela;Username=postgres;Password=postgres
      - ASPNETCORE_URLS=http://+:80
      - JWT_KEY=dev-secret-key-should-be-32-characters-long!
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - postgres
    ports:
      - '5001:80'

  auth-api:
    build:
      context: ./backend/services
      dockerfile: SA.Tourism.Auth.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - JWT_KEY=dev-secret-key-should-be-32-characters-long!
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
    ports:
      - '5002:80'

  express-server:
    build:
      context: ./frontend/server
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ndlela
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deployment}
      LOG_DIR: /app/logs
      APP_URL: http://localhost:5173
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./frontend/client
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      - express-server

volumes:
  pgdata:
  dpkeys:
